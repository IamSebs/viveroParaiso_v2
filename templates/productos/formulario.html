{% extends "base.html" %}
{% block title %}{% if modo == 'editar' %}Editar producto{% else %}Nuevo producto{% endif %}{% endblock %}
{% block heading %}{% if modo == 'editar' %}Editar producto{% else %}Registrar producto{% endif %}{% endblock %}
{% block content %}
<article class="card form-card">
    <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
            <label>Nombre *
                <input type="text" name="nombre" required maxlength="150" value="{{ producto.nombre if producto else '' }}">
            </label>
            <label>Categoría *
                <select name="categoria" required>
                    <option value="">Seleccione</option>
                    {% for cat in ['Plantas de interior','Plantas de exterior','Suculentas','Cactus','Árboles','Arbustos','Flores','Semillas','Macetas','Abonos','Herramientas','Decoración'] %}
                    <option value="{{ cat }}" {% if producto and producto.categoria == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="full">Descripción
                <textarea name="descripcion" rows="3" maxlength="1000">{{ producto.descripcion if producto and producto.descripcion else '' }}</textarea>
            </label>
            <label>Precio de compra *
                <input type="number" name="precio_compra" required min="0.01" step="0.01" value="{{ producto.precio_compra if producto else '' }}">
            </label>
            <label>Precio de venta *
                <input type="number" name="precio_venta" required min="0.01" step="0.01" value="{{ producto.precio_venta if producto else '' }}">
            </label>
            <label>Cantidad disponible *
                <input type="number" name="cantidad_disponible" required min="0" step="1" value="{{ producto.cantidad_disponible if producto else 0 }}">
            </label>
            <label>Stock mínimo *
                <input type="number" name="stock_minimo" required min="0" step="1" value="{{ producto.stock_minimo if producto else 0 }}">
            </label>
            <label class="full">Proveedor *
                <select name="proveedor_id" required>
                    <option value="">Seleccione un proveedor</option>
                    {% for prov in proveedores %}
                    <option value="{{ prov.id }}" {% if producto and producto.proveedor_id|string == prov.id|string %}selected{% endif %}>{{ prov.nombre_empresa }}</option>
                    {% endfor %}
                </select>
            </label>
        </div>
        <div class="form-actions">
            <a class="btn btn-ghost" href="{{ url_for('productos.lista') }}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
        </div>
    </form>
</article>
{% endblock %}
